name: Render Manim Animation

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, LaTeX, Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            texlive \
            texlive-latex-extra \
            texlive-fonts-recommended \
            libcairo2-dev \
            libpango1.0-dev

      - name: Install Manim Python Package
        run: |
          python -m pip install --upgrade pip
          pip install manim

      - name: Render Manim Scene
        run: |
          manim -pqh scene.py MechanicalLinkage

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: animation-video
          path: media/videos/

